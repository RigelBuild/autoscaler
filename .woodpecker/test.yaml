# Pin to Linux: unlabeled workflows can land on the macOS agents, whose
# local backend cannot run container images.
labels:
  os: linux
  # golangci-lint peaks ~4.2 GB with client-go, over a 4 GiB Spot pool agent.
  size: large

when:
  - event: pull_request

variables:
  - &golang_image 'docker.io/golang:1.27'
  - &when
    - path: &when_path # related config files
        - '.woodpecker/test.yml'
        - '.golangci.yml'
        # go source code
        - '**/*.go'
        - 'go.*'
        # schema changes
        - 'pipeline/schema/**'
        # tools updates
        - Makefile
      branch:
        exclude: ${CI_REPO_DEFAULT_BRANCH}
      event: push
    - path: *when_path
      event: [pull_request, tag, deployment]

steps:
  - name: test-release-workflows
    image: docker.io/bash:5
    commands:
      - apk add --no-cache git yq-go
      - .github/scripts/resolve-image-version.test.sh
      - .github/scripts/check-release-source.test.sh
      - .github/scripts/release-tag.test.sh
      - .github/scripts/finalize-images.test.sh
      - .github/scripts/workflow-contract.test.sh
    when:
      - event: pull_request
        path:
          - '.github/scripts/**'
          - '.github/workflows/**'
          - '.github/rigel-version'
          - '.woodpecker/test.yaml'
  - name: vendor
    image: *golang_image
    commands:
      - go mod vendor

  - name: lint
    image: *golang_image
    depends_on: [vendor]
    commands:
      - make lint
    when: *when

  - name: lint-editorconfig
    image: docker.io/woodpeckerci/plugin-editorconfig-checker:0.3.4
    depends_on: []

  - name: test
    image: *golang_image
    depends_on: [vendor]
    commands:
      - make test
    when: *when
