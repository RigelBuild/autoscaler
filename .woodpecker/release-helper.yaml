# Pin to a Linux docker agent: unlabeled workflows can land on the macOS
# agents, whose local backend cannot run container images.
labels:
  os: linux

when:
  event: push
  branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  - name: release
    image: docker.io/woodpeckerci/plugin-ready-release-go:4.1.1
    pull: true
    settings:
      git_email: woodpecker-bot@obermui.de
      github_token:
        from_secret: GITHUB_TOKEN
