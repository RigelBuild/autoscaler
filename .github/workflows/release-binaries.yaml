name: release-binaries

'on':
  push:
    tags:
      - 'v*.*.*-rigel.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Require release ancestry
        env:
          REF: ${{ github.ref }}
        run: .github/scripts/check-release-source.sh "$REF"

      - name: Resolve and validate version
        id: version
        env:
          REF: ${{ github.ref }}
        run: |
          version="$(.github/scripts/resolve-image-version.sh push "$REF" "" .github/rigel-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Validated release version: $version"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build release binary
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGETOS: ${{ matrix.os }}
          TARGETARCH: ${{ matrix.arch }}
        run: |
          make build VERSION="$VERSION" TARGETOS="$TARGETOS" TARGETARCH="$TARGETARCH"
          mv dist/woodpecker-autoscaler "dist/woodpecker-autoscaler_${VERSION}_${TARGETOS}-${TARGETARCH}"

      - name: Upload release binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: woodpecker-autoscaler_${{ needs.resolve.outputs.version }}_${{ matrix.os }}-${{ matrix.arch }}
          path: dist/woodpecker-autoscaler_${{ needs.resolve.outputs.version }}_${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.resolve.outputs.version }}
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: woodpecker-autoscaler_*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum woodpecker-autoscaler_* > SHA256SUMS

      # publish-image's finalize job may create the same release; either order is fine.
      - name: Create or reuse GitHub Release
        run: gh release create "$TAG" --verify-tag --generate-notes || gh release view "$TAG" >/dev/null

      # No --clobber: pinned flake consumers rely on asset bytes staying fixed.
      - name: Upload binaries and checksums
        run: gh release upload "$TAG" dist/woodpecker-autoscaler_* dist/SHA256SUMS
